name: Build persona-chromium macOS binaries
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64

jobs:
  build:
    name: Build ${{ inputs.arch }}
    uses: ./.github/workflows/building.yml
    secrets: inherit
    with:
      arch: ${{ inputs.arch }}
      os: ${{ inputs.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
